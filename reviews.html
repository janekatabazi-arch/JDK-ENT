<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JDK ENTERPRISES - Reviews</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="menuSelect"></div>

<div class="layout1" id="layout1">

    <div class="navBar">

        <img
            src="menu.png"
            alt="Menu"
            id="menu"
        >

        <h1 class="head">JDK ENT</h1>

        <input
            type="text"
            id="getData"
            placeholder="Search reviews..."
        >

        <img
            src="search.png"
            alt="Search"
            id="submitSearch"
        >

    </div>


    <main class="reviewsPage">

        <h2 class="pageTitle">
            Ratings & Reviews
        </h2>


        <section class="ratingSummary">

            <div>

                <h1 id="averageRating">
                    0.0
                </h1>

                <div
                    class="summaryStars"
                    id="summaryStars"
                >
                    ☆☆☆☆☆
                </div>

                <p id="reviewCount">
                    0 Reviews
                </p>

            </div>

        </section>


        <section class="reviewFormCard">

            <h3>Rate JDK Enterprises</h3>

            <div
                class="ratingStars"
                id="ratingStars"
            >

                <span data-value="1">☆</span>
                <span data-value="2">☆</span>
                <span data-value="3">☆</span>
                <span data-value="4">☆</span>
                <span data-value="5">☆</span>

            </div>


            <input
                type="text"
                id="reviewName"
                class="reviewInput"
                placeholder="Your name"
            >


            <textarea
                id="reviewMessage"
                class="reviewMessage"
                placeholder="Write your review..."
            ></textarea>


            <button
                id="submitReview"
                class="submitReviewBtn"
            >
                Submit Review
            </button>

        </section>


        <section>

            <h2 class="reviewSectionTitle">
                Customer Reviews
            </h2>

            <div id="reviewsContainer"></div>

        </section>

    </main>

</div>


<footer>

    <ul class="footerTabs">

        <li class="list">
            <a href="index.html">Home</a>
        </li>

        <li class="list">
            <a href="categories.html">Categories</a>
        </li>

        <li class="list">
            <a href="messages.html">Message</a>
        </li>

        <li class="list">
            <a href="cart.html">Cart</a>
        </li>

        <li class="list">
            <a href="about.html">About</a>
        </li>

        <li class="list">
            <a href="support.html">Support</a>
        </li>

    </ul>

</footer>


<script src="script.js"></script>
<script src="reviews.js"></script>

</body>

</html>
