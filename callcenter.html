<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JDK ENTERPRISES - Call Center</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="menuSelect"></div>

<div class="layout1" id="layout1">

    <div class="navBar">

        <img
            src="menu.png"
            alt="Menu"
            id="menu"
        >

        <h1 class="head">JDK ENT</h1>

        <input
            type="text"
            id="getData"
            placeholder="Search department..."
        >

        <img
            src="search.png"
            alt="Search"
            id="submitSearch"
        >

    </div>


    <main class="callCenterPage">

        <section class="callHero">

            <div class="callHeroIcon">
                📞
            </div>

            <h1>JDK Call Center</h1>

            <p>
                Contact the right department
                for fast assistance.
            </p>

            <div class="centerStatus">

                <span class="statusDot"></span>

                Call Center Active

            </div>

        </section>


        <section
            class="departmentsGrid"
            id="departmentsContainer"
        ></section>


        <section class="emergencySupport">

            <h2>Need More Help?</h2>

            <p>
                Send a support request and our team
                will respond to you.
            </p>

            <button id="supportPageBtn">
                Contact Support
            </button>

        </section>

    </main>

</div>


<footer>

    <ul class="footerTabs">

        <li class="list">
            <a href="index.html">Home</a>
        </li>

        <li class="list">
            <a href="categories.html">
                Categories
            </a>

        <li class="list">

        </li>

        <li class="list">

        </li>

    </ul>

</footer>


<script src="script.js"></script>
<script src="callcenter.js"></script>

</body>

</html>
