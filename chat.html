<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JDK ENTERPRISES - Chat</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="chatPage">

    <header class="chatHeader">

        <button
            id="backChat"
            class="chatBackBtn">
            ←
        </button>

        <img
            id="chatImage"
            class="chatProfile"
            alt="Profile">

        <div>

            <h3 id="chatName">
                Chat
            </h3>

            <span>Online</span>

        </div>

    </header>


    <main
        class="chatMessages"
        id="chatMessages">
    </main>


    <div class="chatInputArea">

        <input
            type="text"
            id="chatInput"
            placeholder="Type a message...">

        <button id="sendMessage">
            Send
        </button>

    </div>

</div>


<script src="chat.js"></script>

</body>

</html>
